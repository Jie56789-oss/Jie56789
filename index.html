<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="智财管家">
  <title>智财管家 · 工资核算</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.04);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(91, 76, 219, 0.3);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--primary);
    }
    :root {
      --primary: #6c5ce7;
      --primary-light: rgba(108, 92, 231, 0.15);
      --primary-glow: rgba(108, 92, 231, 0.25);
      --primary-dark: #5a4bd1;
      --secondary: #00cec9;
      --accent: #fd79a8;
      --bg: #0a0e1a;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.06);
      --text-primary: #e8ecf4;
      --text-secondary: #8892b0;
      --text-muted: #5a6a8a;
      --shadow-glow: 0 8px 32px rgba(108, 92, 231, 0.10);
      --radius-sm: 12px;
      --radius-md: 20px;
      --radius-lg: 28px;
      --radius-xl: 40px;
      --transition: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      --color-income: #00b894;
      --color-expense: #ff6b6b;
      --color-warning: #fdcb6e;
      --input-bg: rgba(255, 255, 255, 0.03);
      --input-border: rgba(255, 255, 255, 0.04);
      --input-focus-bg: rgba(255, 255, 255, 0.05);
      --hover-bg: rgba(108, 92, 231, 0.05);
      --modal-bg: rgba(20, 24, 40, 0.95);
      --toast-bg: rgba(0, 0, 0, 0.85);
      --toast-color: var(--toast-color);
    }

    [data-theme="light"] {
      --primary: #5b4cdb;
      --primary-light: rgba(91, 76, 219, 0.10);
      --primary-glow: rgba(91, 76, 219, 0.15);
      --primary-dark: #4a3ec7;
      --secondary: #00b5b0;
      --accent: #e85d8e;
      --bg: #f5f7fa;
      --card-bg: #ffffff;
      --card-border: rgba(0, 0, 0, 0.06);
      --text-primary: #1a1a2e;
      --text-secondary: #5a6a8a;
      --text-muted: #8892b0;
      --shadow-glow: 0 4px 24px rgba(91, 76, 219, 0.08);
      --color-income: #00a884;
      --color-expense: #e74c3c;
      --color-warning: #f39c12;
      --input-bg: #fafbfc;
      --input-border: rgba(0, 0, 0, 0.08);
      --input-focus-bg: #ffffff;
      --hover-bg: rgba(91, 76, 219, 0.05);
      --modal-bg: #ffffff;
      --toast-bg: #1a1a2e;
      --toast-color: var(--toast-color);
    }

    html, body {
      transition: background-color 0.4s ease, color 0.4s ease;
    }
    body {
      font-family: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      padding: 16px 16px 0;
      color: var(--text-primary);
      overflow-x: hidden;
      position: relative;
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    #particleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .glow-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      animation: floatOrb 20s ease-in-out infinite alternate;
    }
    .glow-orb.orb1 {
      width: 400px;
      height: 400px;
      background: rgba(91, 76, 219, 0.08);
      top: -100px;
      right: -100px;
    }
    .glow-orb.orb2 {
      width: 300px;
      height: 300px;
      background: rgba(0, 181, 176, 0.06);
      bottom: -50px;
      left: -50px;
      animation-delay: -7s;
    }
    .glow-orb.orb3 {
      width: 200px;
      height: 200px;
      background: rgba(232, 93, 142, 0.05);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -14s;
    }
    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -40px) scale(1.1); }
      66% { transform: translate(-20px, 20px) scale(0.9); }
      100% { transform: translate(10px, -10px) scale(1.05); }
    }
    .main-app {
      position: relative;
      z-index: 1;
      max-width: 1000px;
      margin: 0 auto;
      padding-bottom: 20px;
    }
    .app-header {
      text-align: center;
      padding: 18px 20px 12px;
      background: linear-gradient(135deg, var(--card-bg) 0%, var(--primary-light) 50%, rgba(0,181,176,0.05) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      border: 1px solid rgba(0, 0, 0, 0.04);
      border-bottom: none;
      position: relative;
      overflow: hidden;
    }
    .app-header::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(from 0deg, transparent, rgba(91, 76, 219, 0.12), transparent, rgba(0, 181, 176, 0.10), transparent);
      animation: rotateBg 20s linear infinite;
    }
    @keyframes rotateBg {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .app-header .brand {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #6c5ce7, #00cec9, #fd79a8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      background-size: 300% 300%;
      animation: gradientShift 4s ease-in-out infinite;
    }
    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    .app-header .brand .brand-icon {
      font-size: 1.8rem;
      -webkit-text-fill-color: initial;
      background: none;
      animation: pulseIcon 2s ease-in-out infinite;
    }
    @keyframes pulseIcon {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .app-header .subtitle {
      position: relative;
      z-index: 1;
      font-size: 0.95rem;
      color: var(--text-secondary);
      letter-spacing: 3px;
      margin-top: 2px;
      font-weight: 300;
    }
    .bottom-nav {
      display: flex;
      align-items: stretch;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
      border: 1px solid rgba(0, 0, 0, 0.04);
      border-top: 1px solid rgba(0, 0, 0, 0.03);
      overflow: hidden;
    }
    .bottom-nav .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 10px 4px 8px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      font-family: inherit;
      min-height: 52px;
      position: relative;
      border-bottom: 2px solid transparent;
    }
    .bottom-nav .nav-btn .tab-icon {
      font-size: 1.2rem;
      line-height: 1;
      transition: transform 0.3s ease;
    }
    .bottom-nav .nav-btn .tab-label {
      font-size: 0.85rem;
      letter-spacing: 0.5px;
    }
    .bottom-nav .nav-btn:hover {
      background: rgba(0, 0, 0, 0.03);
      color: var(--text-primary);
    }
    .bottom-nav .nav-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      background: rgba(91, 76, 219, 0.08);
    }
    .bottom-nav .nav-btn.active .tab-icon {
      transform: translateY(-2px) scale(1.08);
    }
    .nav-wrapper {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius-lg);
      border: 1px solid rgba(0, 0, 0, 0.05);
      margin-bottom: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-glow);
    }
    .nav-wrapper .app-header {
      border-radius: 0;
      border: none;
      box-shadow: none;
      margin-bottom: 0;
      padding-bottom: 2px;
    }
    .nav-wrapper .bottom-nav {
      border-radius: 0;
      border: none;
      box-shadow: none;
      margin-bottom: 0;
      border-top: 1px solid rgba(0, 0, 0, 0.03);
    }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-radius: var(--radius-lg);
      border: 1px solid var(--card-border);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06), 0 8px 32px rgba(91, 76, 219, 0.04);
      transition: all var(--transition);
      opacity: 0;
      transform: translateY(30px) scale(0.98);
      margin-bottom: 16px;
      overflow: hidden;
    }
    .card.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .card-header {
      padding: 14px 18px;
      font-weight: 600;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--text-primary);
      border-bottom: 1px solid rgba(0, 0, 0, 0.04);
      background: linear-gradient(135deg, var(--primary-light) 0%, var(--card-bg) 100%);
    }
    .card-body {
      padding: 16px 18px;
    }
    @media(max-width:640px) {
      .card-body { padding: 12px 14px; }
      .card-header { padding: 12px 14px; font-size: 0.95rem; }
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 18px;
      border-radius: var(--radius-xl);
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      min-height: 38px;
      font-family: inherit;
    }
    .btn:active { transform: scale(0.94); }
    .btn-primary {
      background: linear-gradient(135deg, #6c5ce7, #a29bfe, #6c5ce7);
      background-size: 300% 300%;
      color: var(--toast-color);
      animation: btnShimmer 3s ease-in-out infinite;
      box-shadow: 0 4px 16px rgba(108, 92, 231, 0.2);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(108, 92, 231, 0.3);
    }
    @keyframes btnShimmer {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    .btn-outline {
      background: transparent;
      color: var(--text-primary);
      border: 1px solid rgba(0, 0, 0, 0.08);
    }
    .btn-outline:hover {
      border-color: var(--primary);
      background: rgba(91, 76, 219, 0.05);
    }
    .btn-ghost {
      background: rgba(0, 0, 0, 0.02);
      color: var(--text-secondary);
      border: 1px solid transparent;
    }
    .btn-ghost:hover {
      background: rgba(0, 0, 0, 0.04);
      color: var(--text-primary);
    }
    .btn-sm {
      padding: 4px 10px;
      font-size: 0.95rem;
      min-height: 28px;
    }
    .btn-pdf {
      background: linear-gradient(135deg, #ff6b6b, #ee5a24);
      color: var(--toast-color);
      box-shadow: 0 4px 16px rgba(255, 107, 107, 0.15);
    }
    .btn-pdf:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255, 107, 107, 0.25);
    }
    .form-group {
      margin-bottom: 4px;
    }
    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 4px;
      padding-left: 4px;
      letter-spacing: 0.3px;
    }
    .form-group input,
    .form-group select {
      background: var(--input-bg);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: var(--radius-md);
      padding: 8px 14px;
      font-size: 0.75rem;
      transition: all 0.3s ease;
      width: 100%;
      min-height: 40px;
      color: var(--text-primary);
      font-family: inherit;
      outline: none;
    }
    .form-group input:focus,
    .form-group select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(91, 76, 219, 0.08);
      background: var(--card-bg);
    }
    .params-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    @media(min-width:600px) {
      .params-grid { grid-template-columns: repeat(3, 1fr); }
    }
    .tab-panel {
      display: none;
      animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .tab-panel.active {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .hide { display: none !important; }
    .badge {
      display: inline-block;
      font-size: 0.45rem;
      background: rgba(108, 92, 231, 0.08);
      color: var(--primary);
      padding: 1px 8px;
      border-radius: var(--radius-xl);
      font-weight: 500;
    }
    .toast {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(-12px);
      background: var(--toast-bg);
      backdrop-filter: blur(20px);
      color: var(--toast-color);
      padding: 10px 20px;
      border-radius: var(--radius-xl);
      font-size: 0.95rem;
      z-index: 200;
      opacity: 0;
      transition: all 0.4s ease;
      pointer-events: none;
      border: 1px solid rgba(0, 0, 0, 0.06);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 150;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-box {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border-radius: var(--radius-lg);
      padding: 22px;
      width: 92%;
      max-width: 420px;
      text-align: center;
      border: 1px solid rgba(0, 0, 0, 0.06);
      box-shadow: 0 16px 64px rgba(0, 0, 0, 0.15);
      max-height: 90vh;
      overflow-y: auto;
      color: var(--text-primary);
    }
    .modal-box input,
    .modal-box select {
      width: 100%;
      padding: 10px 14px;
      margin: 4px 0;
      border-radius: var(--radius-xl);
      border: 1px solid rgba(0, 0, 0, 0.08);
      text-align: center;
      font-size: 0.75rem;
      background: var(--input-bg);
      color: var(--text-primary);
      outline: none;
    }
    .modal-box input:focus,
    .modal-box select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(91, 76, 219, 0.08);
    }
    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    /* ===== 时段输入区域 ===== */
    .time-segments-area {
      background: var(--input-bg);
      border-radius: var(--radius-md);
      padding: 8px 10px;
      margin: 6px 0;
      border: 1px solid var(--input-border);
    }
    .time-segments-area .seg-label {
      font-size: 0.65rem;
      color: var(--text-secondary);
      font-weight: 500;
      display: block;
      margin-bottom: 4px;
      text-align: left;
    }
    .time-segment {
      display: flex;
      gap: 6px;
      align-items: center;
      margin: 3px 0;
      flex-wrap: wrap;
      justify-content: center;
      padding: 4px 6px;
      background: var(--card-bg);
      border-radius: var(--radius-sm);
      border: 1px solid var(--input-border);
    }
    .time-segment input[type="time"] {
      width: 100px;
      padding: 6px 8px;
      border-radius: var(--radius-xl);
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--text-primary);
      font-size: 0.85rem;
      text-align: center;
      outline: none;
      min-height: 34px;
    }
    .time-segment input[type="time"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(91, 76, 219, 0.08);
    }
    .time-segment input[type="time"]::-webkit-calendar-picker-indicator {
      filter: invert(0.6);
      cursor: pointer;
    }
    .time-segment .seg-hours {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary);
      min-width: 48px;
      text-align: center;
    }
    .time-segment .seg-del {
      background: rgba(255, 80, 80, 0.08);
      border: 1px solid rgba(255, 80, 80, 0.1);
      border-radius: var(--radius-xl);
      padding: 2px 10px;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--color-expense);
      min-height: 28px;
      min-width: 32px;
    }
    .time-segment .seg-del:hover {
      background: rgba(255, 80, 80, 0.15);
    }
    .time-segment label {
      font-size: 0.6rem;
      color: var(--text-secondary);
      font-weight: 500;
    }
    .add-segment-btn {
      font-size: 0.8rem;
      padding: 3px 12px;
      border-radius: var(--radius-xl);
      border: 1px dashed var(--text-muted);
      background: transparent;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.2s;
      margin: 4px 0 2px;
      min-height: 30px;
      width: 100%;
    }
    .add-segment-btn:hover {
      border-color: var(--primary);
      color: var(--text-primary);
      background: var(--primary-light);
    }

    .modal-hours-input-wrap {
      margin: 8px 0 4px;
      padding: 8px 12px;
      background: var(--primary-light);
      border-radius: var(--radius-md);
      border: 1px solid var(--primary-glow);
    }
    .modal-hours-input-wrap label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 4px;
      letter-spacing: 0.5px;
      text-align: left;
    }
    .modal-hours-input-wrap input[type="number"] {
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--radius-xl);
      border: 2px solid rgba(108, 92, 231, 0.2);
      background: var(--card-bg);
      color: var(--text-primary);
      font-size: 1.3rem;
      font-weight: 700;
      text-align: center;
      outline: none;
      min-height: 52px;
      transition: all 0.3s ease;
      letter-spacing: 2px;
    }
    .modal-hours-input-wrap input[type="number"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.15);
    }
    .modal-hours-input-wrap input[type="number"]::placeholder {
      color: var(--text-muted);
      font-weight: 400;
      font-size: 1rem;
    }

    .overtime-stats {
      background: rgba(108, 92, 231, 0.04);
      border-radius: var(--radius-md);
      padding: 6px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      justify-content: space-around;
      font-size: 0.75rem;
      margin: 4px 0;
    }
    .overtime-stats strong { color: var(--primary); }
    .overtime-multiplier {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      font-size: 0.75rem;
      background: rgba(108, 92, 231, 0.04);
      border-radius: var(--radius-md);
      padding: 4px 10px;
      margin-bottom: 4px;
    }
    .overtime-multiplier strong { color: var(--primary); }
    .overtime-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
      margin: 3px 0 6px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }
    .calendar-day {
      background: rgba(0, 0, 0, 0.02);
      border-radius: var(--radius-sm);
      border: 2px solid transparent;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 58px;
      padding: 4px 2px;
      transition: all 0.2s ease;
      text-align: center;
      color: var(--text-primary);
      position: relative;
    }
    .calendar-day:hover {
      background: rgba(108, 92, 231, 0.05);
      border-color: rgba(108, 92, 231, 0.08);
    }
    .calendar-day .day-number {
      font-weight: 600;
      font-size: 1rem;
      line-height: 1.3;
    }
    .calendar-day.weekend {
      background: rgba(0, 0, 0, 0.01);
    }

      text-align: center;
      font-weight: 600;
      font-size: 0.85rem;

      text-overflow: ellipsis;

      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 3px 0;
      font-weight: 600;
      font-size: 0.8rem;
    }
    .calendar-nav button {
      background: rgba(0, 0, 0, 0.02);
      border: 1px solid rgba(0, 0, 0, 0.02);
      border-radius: var(--radius-xl);
      padding: 2px 8px;
      cursor: pointer;
      font-size: 0.75rem;
      color: var(--text-primary);
      transition: all 0.2s;
    }
    .calendar-nav button:hover {
      background: rgba(108, 92, 231, 0.05);
      border-color: var(--primary);
    }
    .month-picker {
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: center;
      margin-bottom: 8px;
    }
    .month-picker button {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.03);
      background: rgba(0, 0, 0, 0.02);
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--text-primary);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .month-picker button:hover {
      background: rgba(108, 92, 231, 0.05);
      border-color: var(--primary);
    }
    .month-picker .display {
      font-weight: 600;
      font-size: 0.85rem;
      min-width: 60px;
      text-align: center;
    }
    .section-title {
      font-weight: 600;
      font-size: 0.75rem;
      margin: 8px 0 4px;
      padding-bottom: 3px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.02);
      color: var(--primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
      letter-spacing: 0.5px;
    }
    .section-title .toggle-icon {
      font-size: 0.9rem;
      transition: transform 0.3s ease;
      color: var(--text-secondary);
    }
    .section-title.collapsed .toggle-icon {
      transform: rotate(-90deg);
    }
    .section-content.collapsed {
      display: none;
    }
    .section-content {
      padding: 2px 0 6px;
    }
    .history-table-wrap {
      overflow-x: auto;
      border-radius: var(--radius-md);
      background: var(--input-bg);
      border: 1px solid rgba(0, 0, 0, 0.03);
    }
    .history-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      white-space: nowrap;
    }
    .history-table th,
    .history-table td {
      padding: 8px 10px;
      text-align: center;
      border-bottom: 1px solid rgba(0, 0, 0, 0.04);
    }
    .history-table th {
      background: rgba(91, 76, 219, 0.08);
      font-weight: 600;
      color: var(--primary);
      font-size: 0.85rem;
    }
    .history-table .net-pay {
      color: var(--primary);
      font-weight: 700;
    }
    .history-table .tax {
      color: var(--color-expense);
    }
    .delete-record-btn {
      background: rgba(255, 80, 80, 0.06);
      border: 1px solid rgba(255, 80, 80, 0.06);
      color: var(--color-expense);
      padding: 1px 6px;
      border-radius: var(--radius-xl);
      font-size: 0.85rem;
      cursor: pointer;
    }
    .salary-export-group {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      justify-content: center;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(0, 0, 0, 0.02);
    }
    .bottom-actions {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 4px 0;
    }
    .annual-summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 4px;
    }
    .annual-summary-item {
      background: rgba(0, 0, 0, 0.02);

      padding: 6px 8px;
      text-align: center;
      border: 1px solid rgba(0, 0, 0, 0.01);

      font-size: 0.45rem;

    }

      font-size: 0.8rem;

    }
    @media(max-width:640px) {

      .calendar-day { min-height: 48px; }
      .calendar-day .day-number { font-size: 0.9rem; }
      .overtime-badge { font-size: 0.5rem; padding: 1px 4px; }

  </style>
</head>
<body>

  <canvas id="particleCanvas"></canvas>

  <div class="main-app" id="mainApp">

          <div class="section-title" id="toggleIncomeParams"><span>💰 收入</span><span class="toggle-icon">▼</span></div>

              <div class="form-group"><label>其他收入</label><input type="number" id="otherIncome" step="50" min="0" inputmode="decimal" pattern="[0-9]*"></div>
              <div class="form-group"><label>月计薪天数</label><input type="number" id="workDaysPerMonth" step="0.25" min="0.1"></div>
              <div class="form-group"><label>日工时</label><input type="number" id="workHoursPerDay" step="0.5" min="0.1"></div>
            </div>
            <div style="font-size:0.6rem;color:var(--text-secondary);margin:4px 0;">⚡ 时薪 ≈ <strong id="hourlyRatePreview" style="color:var(--primary);">0.00</strong> 元/小时</div>
          </div>

          <div class="section-title" id="toggleOvertimeParams"><span>⏱️ 加班倍率</span><span class="toggle-icon">▼</span></div>
          <div class="section-content" id="overtimeParamsContent">
            <div class="params-grid">
              <div class="form-group"><label>工作日</label><input type="number" id="multiplierWeekday" step="0.1" min="0"></div>
              <div class="form-group"><label>休息日</label><input type="number" id="multiplierWeekend" step="0.1" min="0"></div>
              <div class="form-group"><label>节假日</label><input type="number" id="multiplierHoliday" step="0.1" min="0"></div>
              <div class="form-group" style="grid-column:span 2;"><label>加班费合计</label><div style="font-size:1rem;font-weight:700;color:var(--primary);" id="overtimeTotalDisplay">¥0.00</div></div>
            </div>
          </div>

          <div class="section-title" id="toggleDeductParams"><span>📉 扣除项</span><span class="toggle-icon">▼</span></div>
          <div class="section-content" id="deductParamsContent">
            <div class="params-grid">
              <div class="form-group"><label>社保</label><input type="number" id="socialInsurance" step="0.01" min="0" inputmode="decimal" pattern="[0-9]*"></div>
              <div class="form-group"><label>公积金</label><input type="number" id="housingFund" step="0.01" min="0" inputmode="decimal" pattern="[0-9]*"></div>
              <div class="form-group"><label>其他扣除</label><input type="number" id="otherDeduction" step="10" min="0" inputmode="decimal" pattern="[0-9]*"></div>
              <div class="form-group"><label>个税起征点</label><input type="number" id="taxThreshold" step="100" min="0"></div>
            </div>
            <div style="margin-top:6px;border-top:1px solid rgba(255,255,255,0.02);padding-top:6px;">
              <div style="font-size:0.6rem;font-weight:600;color:var(--text-secondary);margin-bottom:3px;">📋 专项附加扣除</div>
              <div class="params-grid">
                <div class="form-group"><label>子女教育</label><input type="number" id="deduct_child" step="100" min="0" value="0"></div>
                <div class="form-group"><label>继续教育</label><input type="number" id="deduct_education" step="100" min="0" value="0"></div>
                <div class="form-group"><label>大病医疗</label><input type="number" id="deduct_medical" step="100" min="0" value="0"></div>
                <div class="form-group"><label>住房贷款</label><input type="number" id="deduct_loan" step="100" min="0" value="0"></div>
                <div class="form-group"><label>住房租金</label><input type="number" id="deduct_rent" step="100" min="0" value="0"></div>
                <div class="form-group"><label>赡养老人</label><input type="number" id="deduct_elder" step="100" min="0" value="0"></div>
                <div class="form-group"><label>婴幼儿照护</label><input type="number" id="deduct_infant" step="100" min="0" value="0"></div>
              </div>
              <div style="font-size:0.55rem;color:var(--text-secondary);">合计：<strong id="deductTotalDisplay">¥0.00</strong></div>
            </div>
            <div style="margin-top:6px;border-top:1px solid rgba(255,255,255,0.02);padding-top:6px;">
              <div class="section-title" id="toggleCustomItems" style="margin-top:0;"><span>🔧 自定义增减项</span><span class="toggle-icon">▼</span></div>
              <div class="section-content" id="customItemsContent">
                <div id="customItemsList"></div>
                <div style="display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;align-items:center;">
                  <input type="text" id="customItemName" placeholder="项目名称" style="flex:1;min-width:60px;padding:3px 8px;border-radius:var(--radius-xl);border:1px solid rgba(255,255,255,0.03);background:rgba(255,255,255,0.02);color:var(--text-primary);font-size:.65rem;outline:none;">
                  <input type="number" id="customItemAmount" placeholder="金额" step="0.01" style="width:60px;padding:3px 8px;border-radius:var(--radius-xl);border:1px solid rgba(255,255,255,0.03);background:rgba(255,255,255,0.02);color:var(--text-primary);font-size:.65rem;outline:none;">
                  <select id="customItemType" style="padding:3px 6px;border-radius:var(--radius-xl);border:1px solid rgba(255,255,255,0.03);background:rgba(255,255,255,0.02);color:var(--text-primary);font-size:.65rem;">
                    <option value="add">➕ 增加</option>
                    <option value="sub">➖ 扣除</option>
                  </select>
                  <button class="btn btn-sm btn-outline" id="btnAddCustomItem">添加</button>
                </div>
              </div>
            </div>
          </div>

          <div style="margin-top:6px;text-align:center;">
            <button class="btn btn-primary" id="btnCalculate">📊 计算并存入历史</button>
            <button class="btn btn-outline" id="btnReset">🔄 重置参数</button>
          </div>
          <div style="text-align:center;font-size:.55rem;color:var(--text-secondary);">⌨️ Ctrl+Enter 快速计算</div>
        </div>
      </div>
    </div>

    <!-- ===== 加班面板 ===== -->
    <div class="tab-panel" id="tab-overtime">
      <div class="card">
        <div class="card-header">📆 加班日历 <span class="badge">点击日期编辑</span></div>
        <div class="card-body">
          <div class="overtime-toolbar">
            <button class="btn btn-sm btn-outline" id="btnBatchSelect">📅 批量</button>
            <button class="btn btn-sm btn-ghost" id="btnCancelSelect" style="display:none;">❌ 取消</button>
            <span style="font-size:.55rem;color:var(--text-secondary);">点击两个日期</span>
            <button class="btn btn-sm btn-pdf" id="btnExportOvertime" style="margin-left:auto;">📄 PDF</button>
            <button class="btn btn-sm btn-outline" id="btnExportOvertimeCSV">📊 CSV</button>
          </div>
          <div class="overtime-multiplier">
            <span>🏢 <strong id="dispMultWeekday">1.5</strong></span>
            <span>🌙 <strong id="dispMultWeekend">2.0</strong></span>
            <span>🎉 <strong id="dispMultHoliday">3.0</strong></span>
          </div>
          <div class="overtime-stats">
            <span>🏢 <strong id="sumWeekday">0</strong>h</span>
            <span>🌙 <strong id="sumWeekend">0</strong>h</span>
            <span>🎉 <strong id="sumHoliday">0</strong>h</span>

          <div class="calendar-nav">

          <div id="calendarContainer" class="calendar-grid"></div>

    <!-- ===== 工资数据面板 ===== -->
    <div class="tab-panel" id="tab-salary">
      <div class="card">
        <div class="card-header">
          <span>📊 月工资数据</span>
          <div style="display:flex;align-items:center;gap:4px;margin-left:auto;">
            <button id="yearDownBtn" style="width:22px;height:22px;border-radius:50%;border:1px solid rgba(255,255,255,0.03);background:rgba(255,255,255,0.02);cursor:pointer;color:var(--text-primary);font-size:0.7rem;">‹</button>

            <button id="yearUpBtn" style="width:22px;height:22px;border-radius:50%;border:1px solid rgba(255,255,255,0.03);background:rgba(255,255,255,0.02);cursor:pointer;color:var(--text-primary);font-size:0.7rem;">›</button>

        </div>

        <button class="btn btn-ghost" id="batchCancel">取消</button>
      </div>

  </div>

  <script>
    // ============================================================
    // 工资核算 + 加班管理 + 数据汇总（仅计时模式）
    // ============================================================
    (function() {
      "use strict";

      var $ = function(id) { return document.getElementById(id); };
      var roundToCent = function(v) { return Math.round((v || 0) * 100) / 100; };
      var getLocalDateString = function(d) {
        d = d || new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      };
      var parseMonthKey = function(k) {
        var p = k.split('-');
        return p.length === 2 ? { year: +p[0], month: +p[1] } : null;
      };
      var daysInMonth = function(y, m) { return new Date(y, m, 0).getDate(); };
      var escapeHtml = function(s) {
        if (!s) return '';
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      };
      var formatNumber = function(n, decimals) {
        if (n === undefined || n === null || isNaN(n)) return '—';
        decimals = decimals !== undefined ? decimals : 2;
        var parts = (+n).toFixed(decimals).split('.');
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        return parts.join('.');
      };

      var storage = {};
      var currentMonthKey = '';
      var currentDayDetails = {};
      var batchSelectMode = false;

      // ---- 粒子 ----
      function initParticles() {
        var canvas = document.getElementById('particleCanvas');
        var ctx = canvas.getContext('2d');
        var particles = [], w, h;
        var resize = function() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; };
        window.addEventListener('resize', resize);
        resize();
        function Particle() { this.reset(); }
        Particle.prototype.reset = function() {
          this.x = Math.random() * w;
          this.y = Math.random() * h;
          this.size = Math.random() * 1.2 + 0.3;
          this.speedX = (Math.random() - 0.5) * 0.3;
          this.speedY = (Math.random() - 0.5) * 0.3;
          this.opacity = Math.random() * 0.3 + 0.03;
        };
        Particle.prototype.update = function() {
          this.x += this.speedX;
          this.y += this.speedY;
          if (this.x < 0 || this.x > w) this.speedX *= -1;
          if (this.y < 0 || this.y > h) this.speedY *= -1;
        };
        Particle.prototype.draw = function() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(108,92,231,' + this.opacity + ')';
          ctx.fill();
        };
        for (var i = 0; i < 50; i++) { var p = new Particle(); particles.push(p); }
        function animate() {
          ctx.clearRect(0, 0, w, h);
          particles.forEach(function(p) { p.update(); p.draw(); });
          for (var i2 = 0; i2 < particles.length; i2++) {
            for (var j = i2 + 1; j < particles.length; j++) {
              var dx = particles[i2].x - particles[j].x;
              var dy = particles[i2].y - particles[j].y;
              var dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < 100) {
                ctx.beginPath();
                ctx.moveTo(particles[i2].x, particles[i2].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.strokeStyle = 'rgba(108,92,231,' + (0.02 * (1 - dist / 100)) + ')';
                ctx.lineWidth = 0.3;
                ctx.stroke();
              }
            }
          }
          requestAnimationFrame(animate);
        }
        animate();
      }
      initParticles();

      // ---- 设置函数 ----
      function getSettings() {
        var s = storage.settings || {};
        return {
          workDaysPerMonth: parseFloat($('workDaysPerMonth')?.value) || s.workDaysPerMonth || 21.75,
          workHoursPerDay: parseFloat($('workHoursPerDay')?.value) || s.workHoursPerDay || 8,
          taxThreshold: parseFloat($('taxThreshold')?.value) || s.taxThreshold || 5000,
          multiplierWeekday: parseFloat($('multiplierWeekday')?.value) || s.multiplierWeekday || 1.5,
          multiplierWeekend: parseFloat($('multiplierWeekend')?.value) || s.multiplierWeekend || 2.0,
          multiplierHoliday: parseFloat($('multiplierHoliday')?.value) || s.multiplierHoliday || 3.0
        };
      }

      function getHourlyRate(base) {
        var s = getSettings();
        var b = parseFloat(base) || 0;
        var d = s.workDaysPerMonth, h = s.workHoursPerDay;
        if (d <= 0 || h <= 0) return NaN;
        return roundToCent(b / d / h);
      }

      function getOvertimeHours() {
        var w = 0, e = 0, h = 0;
        for (var dk in currentDayDetails) {
          var d = currentDayDetails[dk];
          if (d && d.type === 'weekday') w = roundToCent(w + (d.hours || 0));
          else if (d && d.type === 'weekend') e = roundToCent(e + (d.hours || 0));
          else if (d && d.type === 'holiday') h = roundToCent(h + (d.hours || 0));
        }
        return { weekday: w, weekend: e, holiday: h };
      }

      function getSpecialDeductions() {
        return {
          child: parseFloat($('deduct_child')?.value) || 0,
          education: parseFloat($('deduct_education')?.value) || 0,
          medical: parseFloat($('deduct_medical')?.value) || 0,
          loan: parseFloat($('deduct_loan')?.value) || 0,
          rent: parseFloat($('deduct_rent')?.value) || 0,
          elder: parseFloat($('deduct_elder')?.value) || 0,
          infant: parseFloat($('deduct_infant')?.value) || 0
        };
      }

      function calcTotalSpecialDeduction(d) {
        return roundToCent((d.child || 0) + (d.education || 0) + (d.medical || 0) + (d.loan || 0) + (d.rent || 0) + (d.elder || 0) + (d.infant || 0));
      }

      function updateDeductTotalDisplay() {
        var el = $('deductTotalDisplay');
        if (el) el.textContent = '¥' + calcTotalSpecialDeduction(getSpecialDeductions()).toFixed(2);
      }

      function updateHourlyPreview() {
        var rate = getHourlyRate($('baseSalary')?.value);

        updateDeductTotalDisplay();

      function updateOvertimeDisplay() {
        var ot = getOvertimeHours();
        var multW = parseFloat($('multiplierWeekday')?.value) || 0;
        var multE = parseFloat($('multiplierWeekend')?.value) || 0;
        var multH = parseFloat($('multiplierHoliday')?.value) || 0;
        var hr = getHourlyRate($('baseSalary')?.value);
        if ($('sumWeekday')) $('sumWeekday').textContent = ot.weekday.toFixed(1);
        if ($('sumWeekend')) $('sumWeekend').textContent = ot.weekend.toFixed(1);
        if ($('sumHoliday')) $('sumHoliday').textContent = ot.holiday.toFixed(1);
        if ($('dispMultWeekday')) $('dispMultWeekday').textContent = multW.toFixed(1);
        if ($('dispMultWeekend')) $('dispMultWeekend').textContent = multE.toFixed(1);
        if ($('dispMultHoliday')) $('dispMultHoliday').textContent = multH.toFixed(1);
        var pay = isNaN(hr) ? 0 : roundToCent((ot.weekday * multW + ot.weekend * multE + ot.holiday * multH) * hr);
        if ($('overtimeTotalDisplay')) $('overtimeTotalDisplay').textContent = '¥' + pay.toFixed(2);
      }

      // ---- 日历 ----
      function getDayType(y, m, d) {
        var holidays = {
          '2026-01-01': 1, '2026-02-17': 1, '2026-02-18': 1, '2026-02-19': 1, '2026-02-20': 1,
          '2026-04-05': 1, '2026-05-01': 1, '2026-06-19': 1, '2026-10-01': 1, '2026-10-02': 1,
          '2026-10-03': 1, '2026-10-04': 1, '2026-10-05': 1, '2026-10-06': 1, '2026-10-07': 1
        };
        var dk = y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
        if (holidays[dk]) return 'holiday';
        var day = new Date(y, m - 1, d).getDay();
        return (day === 0 || day === 6) ? 'weekend' : 'weekday';
      }

      function renderCalendar() {
        var parsed = parseMonthKey(currentMonthKey);
        if (!parsed) {
          if ($('calendarContainer')) $('calendarContainer').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:12px;color:var(--text-secondary);font-size:0.7rem;">请选择月份</div>';
          return;
        }
        var year = parsed.year, month = parsed.month;
        var days = daysInMonth(year, month);
        var firstDayIndex = new Date(year, month - 1, 1).getDay();
        var weekdays = ['日', '一', '二', '三', '四', '五', '六'];
        var html = '';
        weekdays.forEach(function(wd) { html += '<div class="calendar-weekday">' + wd + '</div>'; });
        for (var i = 0; i < firstDayIndex; i++) {
          html += '<div class="calendar-day" style="background:transparent;visibility:hidden;min-height:58px;"></div>';
        }
        for (var d = 1; d <= days; d++) {
          var dk = year + '-' + String(month).padStart(2, '0') + '-' + String(d).padStart(2, '0');
          var defaultType = getDayType(year, month, d);

          if (!currentDayDetails[dk]) {
            currentDayDetails[dk] = { type: defaultType, hours: 0, segments: [] };
          } else {
            if (currentDayDetails[dk].hours === undefined) currentDayDetails[dk].hours = 0;
            if (!currentDayDetails[dk].segments) currentDayDetails[dk].segments = [];
            if (!currentDayDetails[dk].type) currentDayDetails[dk].type = defaultType;
          }

          var item = currentDayDetails[dk];
          var cls = 'calendar-day ' + (item.type || defaultType);
          if (item.hours > 0) cls += ' has-overtime';
          if (batchSelectMode && rangeStart && rangeEnd) {
            var start = new Date(rangeStart);
            var end = new Date(rangeEnd);
            var cur = new Date(dk);
            if (cur >= start && cur <= end) cls += ' in-range';
          }

          var innerHtml = '<div class="day-number">' + d + '</div>';
          if (item.hours > 0) {
            var timeStr = '';
            if (item.segments && item.segments.length > 0) {
              var segStrs = item.segments.map(function(s) { return s.start + '-' + s.end; });
              timeStr = segStrs.join(', ');
              if (timeStr.length > 14) timeStr = timeStr.slice(0, 14) + '…';
            }
            var displayText = timeStr ? timeStr + ' ' : '';
            displayText += '+' + item.hours + 'h';
            innerHtml += '<div class="overtime-badge" title="' + (timeStr ? timeStr + ' ' : '') + item.hours + '小时加班">' + displayText + '</div>';
          }

          html += '<div class="' + cls + '" data-date="' + dk + '">' + innerHtml + '</div>';
        }
        if ($('calendarContainer')) $('calendarContainer').innerHTML = html;
        if ($('currentMonthLabel')) $('currentMonthLabel').textContent = year + '年' + month + '月';
        updateOvertimeDisplay();
      }

      // ---- 加班模态框 ----
      function addSegment() {
        var container = $('timeSegmentsContainer');
        var idx = segmentCounter++;
        var div = document.createElement('div');
        div.className = 'time-segment';
        div.dataset.index = idx;
        div.innerHTML = '<label>开始</label><input type="time" class="seg-start" value=""><label>结束</label><input type="time" class="seg-end" value=""><span class="seg-hours">0.0h</span><button class="seg-del">✕</button>';
        container.appendChild(div);
        setupSegmentListeners(div);
      }

      function setupSegmentListeners(div) {
        var startInput = div.querySelector('.seg-start');
        var endInput = div.querySelector('.seg-end');
        var hoursSpan = div.querySelector('.seg-hours');
        var delBtn = div.querySelector('.seg-del');

        function calcSeg() {
          if (startInput.value && endInput.value) {
            var start = new Date('1970-01-01T' + startInput.value + ':00');
            var end = new Date('1970-01-01T' + endInput.value + ':00');
            var diff = (end - start) / (1000 * 60 * 60);
            if (diff < 0) diff += 24;
            hoursSpan.textContent = Math.round(diff * 10) / 10 + 'h';
            updateTotalHours();
          } else {
            hoursSpan.textContent = '0.0h';
          }
        }

        startInput.addEventListener('change', calcSeg);
        startInput.addEventListener('input', calcSeg);
        endInput.addEventListener('change', calcSeg);
        endInput.addEventListener('input', calcSeg);

        delBtn.addEventListener('click', function() {
          var container = $('timeSegmentsContainer');
          if (container.children.length <= 1) {
            showToast('至少保留一个时段');
            return;
          }
          div.remove();
          updateTotalHours();
        });

        // 初始计算
        setTimeout(calcSeg, 10);
      }

      function updateTotalHours() {
        var container = $('timeSegmentsContainer');
        var total = 0;
        container.querySelectorAll('.time-segment').forEach(function(seg) {
          var hs = seg.querySelector('.seg-hours');
          if (hs) {
            var v = parseFloat(hs.textContent);
            if (!isNaN(v)) total += v;
          }
        });
        var input = $('modalDayHours');
        if (input) {
          // 如果用户没有手动编辑过，自动更新
          if (!input.dataset.userEdited || input.dataset.userEdited === 'false') {
            input.value = Math.round(total * 10) / 10 || 0;
          }
        }
      }

      function openOvertimeModal(dk) {
        var item = currentDayDetails[dk] || { type: 'weekday', hours: 0, segments: [] };
        if (item.hours === undefined) item.hours = 0;
        if (!item.segments) item.segments = [];
        if (!item.type) item.type = 'weekday';

        if ($('modalDateTitle')) $('modalDateTitle').textContent = dk.split('-')[1] + '月' + parseInt(dk.split('-')[2]) + '日';
        if ($('modalDayType')) $('modalDayType').value = item.type || 'weekday';

        var hoursInput = $('modalDayHours');
        if (hoursInput) {
          hoursInput.value = item.hours || 0;
          hoursInput.dataset.userEdited = 'false';
        }

        var container = $('timeSegmentsContainer');
        container.innerHTML = '';
        segmentCounter = 0;

        if (item.segments && item.segments.length > 0) {
          item.segments.forEach(function(seg) {
            var idx = segmentCounter++;
            var div = document.createElement('div');
            div.className = 'time-segment';
            div.dataset.index = idx;
            div.innerHTML = '<label>开始</label><input type="time" class="seg-start" value="' + (seg.start || '') + '"><label>结束</label><input type="time" class="seg-end" value="' + (seg.end || '') + '"><span class="seg-hours">0.0h</span><button class="seg-del">✕</button>';
            container.appendChild(div);
            setupSegmentListeners(div);
          });
        } else {
          // 默认添加一个空白时段
          addSegment();
        }

        // 延迟计算总小时
        setTimeout(function() {
          updateTotalHours();
          // 如果item有hours，优先使用存储的值
          if (item.hours > 0 && hoursInput) {
            hoursInput.value = item.hours;
            hoursInput.dataset.userEdited = 'false';
          }
        }, 100);

        if (hoursInput) {
          hoursInput.removeEventListener('input', onHoursInput);
          hoursInput.addEventListener('input', onHoursInput);
        }

        if ($('modalOverlay')) {
          $('modalOverlay')._currentDate = dk;
          $('modalOverlay').classList.add('active');
        }
      }

      function onHoursInput(e) {
        e.target.dataset.userEdited = 'true';
      }

      function saveOvertimeFromModal() {
        var overlay = $('modalOverlay');
        var dk = overlay._currentDate;
        if (!dk) { showToast('❌ 未选中日期'); return; }

        var type = $('modalDayType').value;
        var totalHours = parseFloat($('modalDayHours').value) || 0;

        // 收集时段
        var segments = [];
        document.querySelectorAll('#timeSegmentsContainer .time-segment').forEach(function(seg) {
          var start = seg.querySelector('.seg-start').value;
          var end = seg.querySelector('.seg-end').value;
          if (start && end) {
            segments.push({ start: start, end: end });
          }
        });

        // 如果总小时为0但有时段，从时段计算总小时
        if (totalHours === 0 && segments.length > 0) {
          var segTotal = 0;
          segments.forEach(function(s) {
            if (s.start && s.end) {
              var st = new Date('1970-01-01T' + s.start + ':00');
              var en = new Date('1970-01-01T' + s.end + ':00');
              var diff = (en - st) / (1000 * 60 * 60);
              if (diff < 0) diff += 24;
              segTotal += diff;
            }
          });
          totalHours = Math.round(segTotal * 10) / 10;
        }

        // 如果总小时为0且没有时段，清除记录
        if (totalHours === 0 && segments.length === 0) {
          if (currentDayDetails[dk]) {
            delete currentDayDetails[dk];
            saveOvertimeData();
            renderCalendar();
            overlay.classList.remove('active');
            showToast('✅ 已清除该日加班记录');
            return;
          }
          showToast('⚠️ 请输入加班小时数或添加时段');
          return;
        }

        if (!currentDayDetails[dk]) currentDayDetails[dk] = { type: 'weekday', hours: 0, segments: [] };
        currentDayDetails[dk].type = type;
        currentDayDetails[dk].hours = totalHours;
        currentDayDetails[dk].segments = segments;

        saveOvertimeData();
        renderCalendar();
        overlay.classList.remove('active');

        var hoursInput = $('modalDayHours');
        if (hoursInput) hoursInput.dataset.userEdited = 'false';

        showToast('✅ 加班已保存 (' + totalHours + 'h)');
      }

      function handleDateClickForBatch(dk) {
        if (!batchSelectMode) return;
        if (!rangeStart || (rangeStart && rangeEnd)) {

      // ---- 工资计算 ----
      function handleCalculate() {
        if (!currentMonthKey) { showToast('请选择月份'); return; }
        var negFields = ['baseSalary','otherIncome','socialInsurance','housingFund','otherDeduction'];
        for (var fi = 0; fi < negFields.length; fi++) {
          var fv = parseFloat($(negFields[fi])?.value);
          if (fv < 0) { showToast('⚠️ ' + negFields[fi] + ' 不能为负数'); return; }
        }
        var settings = getSettings();
        var baseSalary = roundToCent(parseFloat($('baseSalary')?.value) || 0);
        var otherIncome = roundToCent(parseFloat($('otherIncome')?.value) || 0);
        var socialInsurance = roundToCent(parseFloat($('socialInsurance')?.value) || 0);
        var housingFund = roundToCent(parseFloat($('housingFund')?.value) || 0);
        var otherDeduction = roundToCent(parseFloat($('otherDeduction')?.value) || 0);
        var deductionsDetail = getSpecialDeductions();
        var specialDeduction = calcTotalSpecialDeduction(deductionsDetail);
        var ot = getOvertimeHours();
        var hr = getHourlyRate(baseSalary);
        var otPay = isNaN(hr) ? 0 : roundToCent((ot.weekday * settings.multiplierWeekday + ot.weekend * settings.multiplierWeekend + ot.holiday * settings.multiplierHoliday) * hr);
        var customTotal = getCustomItemsTotal(customItems);
        var grossPay = roundToCent(baseSalary + otPay + otherIncome + customTotal);

        var thr = settings.taxThreshold;
        var taxable = Math.max(0, grossPay - socialInsurance - housingFund - otherDeduction - specialDeduction - thr);
        var tax = 0;
        if (taxable > 0) {
          if (taxable <= 36000) tax = taxable * 0.03;
          else if (taxable <= 144000) tax = taxable * 0.10 - 2520;
          else if (taxable <= 300000) tax = taxable * 0.20 - 16920;
          else if (taxable <= 420000) tax = taxable * 0.25 - 31920;
          else if (taxable <= 660000) tax = taxable * 0.30 - 52920;
          else if (taxable <= 960000) tax = taxable * 0.35 - 85920;
          else tax = taxable * 0.45 - 181920;
          tax = Math.max(0, roundToCent(tax));
        }
        var netPay = roundToCent(grossPay - socialInsurance - housingFund - otherDeduction - tax);

        var recs = {};
        for (var key in storage.history || {}) { recs[key] = storage.history[key]; }
        recs[currentMonthKey] = {
          month: currentMonthKey,
          baseSalary: baseSalary,
          otherIncome: otherIncome,
          totalOvertimePay: otPay,
          grossPay: grossPay,
          socialInsurance: socialInsurance,
          housingFund: housingFund,
          otherDeduction: otherDeduction,
          deductionsDetail: deductionsDetail,
          customItems: JSON.parse(JSON.stringify(customItems)),
          customTotal: customTotal,
          tax: tax,
          netPay: netPay,
          mode: 'time',
          workDaysPerMonth: settings.workDaysPerMonth,
          workHoursPerDay: settings.workHoursPerDay,
          taxThreshold: settings.taxThreshold
        };
        saveToStorageImmediate('history', recs);

        saveAllParams();
        saveOvertimeData();

        updateAnnualSummary();
        showToast('✅ 工资：实发 ¥' + netPay.toFixed(2) + '，个税 ¥' + tax.toFixed(2));
      }

      function getCustomItemsTotal(items) {
        var total = 0;
        items.forEach(function(item) {
          if (item.type === 'add') total = roundToCent(total + item.amount);
          else total = roundToCent(total - item.amount);
        });
        return total;
      }

        loadOvertimeData();
        loadMonthParams(newMK);
        updateAnnualSummary();
        showToast('📅 已切换到 ' + newMK);
      };

      // ---- 初始化 ----
      function initApp() {
        console.log('📋 智财管家 工资核算 启动');
        var savedTheme = localStorage.getItem('app_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        if ($('themeToggleBtn')) $('themeToggleBtn').textContent = savedTheme === 'dark' ? '🌙' : '☀️';

        loadStorage();
        loadCustomItems();

        var now = new Date();
        currentMonthKey = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
        if ($('salaryMonth')) $('salaryMonth').value = currentMonthKey;
        if ($('monthDisplayLabel')) $('monthDisplayLabel').textContent = now.getFullYear() + '年' + (now.getMonth() + 1) + '月';

        var savedSettings = storage.settings || {};
        var defaults = { workDaysPerMonth: 21.75, workHoursPerDay: 8, taxThreshold: 5000, multiplierWeekday: 1.5, multiplierWeekend: 2.0, multiplierHoliday: 3.0 };
        ['workDaysPerMonth','workHoursPerDay','taxThreshold','multiplierWeekday','multiplierWeekend','multiplierHoliday'].forEach(function(key) {
          var el = $(key);
          if (el) el.value = savedSettings[key] !== undefined ? savedSettings[key] : defaults[key];
        });

        // ---- 输入监听 ----
        ['baseSalary','otherIncome','workDaysPerMonth','workHoursPerDay','multiplierWeekday','multiplierWeekend','multiplierHoliday','socialInsurance','housingFund','otherDeduction','taxThreshold'].forEach(function(id) {
          var el = $(id);
          if (el) {
            el.addEventListener('input', function() {
              updateHourlyPreview();
              clearTimeout(autoSaveTimer);
              autoSaveTimer = setTimeout(function() { saveAllParams(); }, 500);
            });
            el.addEventListener('change', function() { saveAllParams(); });
          }
        });
        ['deduct_child','deduct_education','deduct_medical','deduct_loan','deduct_rent','deduct_elder','deduct_infant'].forEach(function(id) {
          var el = $(id);
          if (el) {
            el.addEventListener('input', function() {
              updateDeductTotalDisplay();
              clearTimeout(autoSaveTimer);
              autoSaveTimer = setTimeout(function() { saveAllParams(); }, 500);
            });
            el.addEventListener('change', function() { saveAllParams(); });
          }
        });

        // ---- 导航 ----
        document.querySelectorAll('#bottomNav .nav-btn').forEach(function(btn) {
          btn.addEventListener('click', function() {
            var tab = this.dataset.tab;
            document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
            document.querySelectorAll('#bottomNav .nav-btn').forEach(function(b) { b.classList.remove('active'); });
            var panel = $('tab-' + tab);
            if (panel) panel.classList.add('active');
            this.classList.add('active');
            if (tab === 'overtime') renderCalendar();
            if (tab === 'salary') updateAnnualSummary();
          });
        });

        // ---- 月份按钮 ----
        if ($('monthDownBtn')) $('monthDownBtn').addEventListener('click', function() { window.switchMonth(-1); });
        if ($('monthUpBtn')) $('monthUpBtn').addEventListener('click', function() { window.switchMonth(1); });

        // ---- 日历点击 ----
        if ($('calendarContainer')) {
          $('calendarContainer').addEventListener('click', function(e) {
            var dayEl = e.target.closest('.calendar-day');
            if (!dayEl) return;
            var dk = dayEl.dataset.date;
            if (!dk) return;
            if (batchSelectMode) { handleDateClickForBatch(dk); } else { openOvertimeModal(dk); }
          });
        }

        // ---- 模态框 ----
        if ($('modalSave')) $('modalSave').addEventListener('click', saveOvertimeFromModal);
        if ($('modalClose')) $('modalClose').addEventListener('click', function() { if ($('modalOverlay')) $('modalOverlay').classList.remove('active'); });
        if ($('addSegmentBtn')) $('addSegmentBtn').addEventListener('click', addSegment);
        if ($('modalOverlay')) {
          $('modalOverlay').addEventListener('click', function(e) { if (e.target === this) this.classList.remove('active'); });
        }
        document.addEventListener('keydown', function(e) {
          if (e.key === 'Escape') {
            if ($('modalOverlay') && $('modalOverlay').classList.contains('active')) $('modalOverlay').classList.remove('active');
            if ($('batchModalOverlay') && $('batchModalOverlay').classList.contains('active')) { $('batchModalOverlay').classList.remove('active'); exitBatchSelectMode(); }
          }
        });

        // ---- 批量 ----
        if ($('btnBatchSelect')) $('btnBatchSelect').addEventListener('click', enterBatchSelectMode);
        if ($('btnCancelSelect')) $('btnCancelSelect').addEventListener('click', exitBatchSelectMode);
        if ($('batchApply')) $('batchApply').addEventListener('click', applyBatchSetting);
        if ($('batchCancel')) {
          $('batchCancel').addEventListener('click', function() { if ($('batchModalOverlay')) $('batchModalOverlay').classList.remove('active'); exitBatchSelectMode(); });
        }
        if ($('batchModalOverlay')) {
          $('batchModalOverlay').addEventListener('click', function(e) { if (e.target === this) { this.classList.remove('active'); exitBatchSelectMode(); } });
        }

        // ---- 计算 ----
        if ($('btnCalculate')) $('btnCalculate').addEventListener('click', handleCalculate);
        document.addEventListener('keydown', function(e) { if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); handleCalculate(); } });

        // ---- 重置 ----
        if ($('btnReset')) {
          $('btnReset').addEventListener('click', function() {
            if (!confirm('清空当前月份参数？')) return;
            ['baseSalary','otherIncome','socialInsurance','housingFund','otherDeduction'].forEach(function(id) { var el = $(id); if (el) el.value = ''; });
            ['deduct_child','deduct_education','deduct_medical','deduct_loan','deduct_rent','deduct_elder','deduct_infant'].forEach(function(id) { var el = $(id); if (el) el.value = 0; });
            currentDayDetails = {};
            if (currentMonthKey) {
              saveOvertimeData();
              saveAllParams();
            }
            renderCalendar();
            updateHourlyPreview();
            updateDeductTotalDisplay();
            showToast('✅ 参数已重置');
          });
        }

        // ---- 自定义 ----
        if ($('btnAddCustomItem')) {
          $('btnAddCustomItem').addEventListener('click', function() {
            var name = $('customItemName')?.value?.trim();
            var amount = parseFloat($('customItemAmount')?.value) || 0;
            var type = $('customItemType')?.value || 'add';
            if (!name) { showToast('请输入项目名称'); return; }
            if (amount <= 0) { showToast('请输入有效金额'); return; }
            customItems.push({ name: name, amount: amount, type: type });
            saveCustomItems();
            renderCustomItems();
            saveAllParams();
            if ($('customItemName')) $('customItemName').value = '';
            if ($('customItemAmount')) $('customItemAmount').value = '';
            showToast('✅ 已添加自定义项目');
          });
        }

        // ---- PDF ----
        if ($('btnPrintSalarySlip')) $('btnPrintSalarySlip').addEventListener('click', printSalarySlip);
        if ($('btnPrintYearlyReport')) $('btnPrintYearlyReport').addEventListener('click', printYearlyReport);
        if ($('btnExportOvertime')) $('btnExportOvertime').addEventListener('click', exportOvertimePdf);

        // ---- 年度 ----
        if ($('yearDownBtn')) $('yearDownBtn').addEventListener('click', function() { currentAnnualYear--; renderAnnualSummary(currentAnnualYear); });
        if ($('yearUpBtn')) $('yearUpBtn').addEventListener('click', function() { currentAnnualYear++; renderAnnualSummary(currentAnnualYear); });
        if ($('toggleAnnualHistory')) {
          $('toggleAnnualHistory').addEventListener('click', function() {
            var container = $('annualHistoryContainer');
            if (container.style.display === 'none') { container.style.display = ''; this.textContent = '📋 收起'; } else { container.style.display = 'none'; this.textContent = '📋 展开'; }
          });
        }

        // ---- CSV ----
        if ($('btnExportSalaryCSV')) $('btnExportSalaryCSV').addEventListener('click', exportSalaryCSV);
        if ($('btnExportOvertimeCSV')) $('btnExportOvertimeCSV').addEventListener('click', exportOvertimeCSV);

        // ---- 复制 ----
        if ($('btnCopySalarySlip')) { $('btnCopySalarySlip').addEventListener('click', copySalarySlip); }

        // ---- 主题切换 ----
        if ($('themeToggleBtn')) {
          $('themeToggleBtn').addEventListener('click', function() {
            var current = document.documentElement.getAttribute('data-theme') || 'dark';
            var next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('app_theme', next);
            this.textContent = next === 'dark' ? '🌙' : '☀️';
            showToast(next === 'dark' ? '🌙 已切换深色主题' : '☀️ 已切换浅色主题');
          });
        }

        // ---- 折叠面板 ----
        document.querySelectorAll('.section-title').forEach(function(title) {
          var content = title.nextElementSibling;
          if (content && content.classList.contains('section-content')) { content.classList.remove('collapsed'); }
          title.addEventListener('click', function() {
            this.classList.toggle('collapsed');
            var content2 = this.nextElementSibling;
            if (content2 && content2.classList.contains('section-content')) { content2.classList.toggle('collapsed'); }
          });
        });

        // ---- 加载当前月份数据 ----
        loadOvertimeData();
        loadMonthParams(currentMonthKey);

        // ---- 渲染 ----
        renderCustomItems();
        updateAnnualSummary();

        // ---- 卡片动画 ----
        var cards = document.querySelectorAll('.card');
        var observer = new IntersectionObserver(function(entries) {
          entries.forEach(function(entry) { if (entry.isIntersecting) entry.target.classList.add('visible'); });
        }, { threshold: 0.05 });
        cards.forEach(function(card) { observer.observe(card); });
        setTimeout(function() { cards.forEach(function(card) { var rect = card.getBoundingClientRect(); if (rect.top < window.innerHeight) card.classList.add('visible'); }); }, 100);

        // ---- 页面关闭保存 ----
        window.addEventListener('beforeunload', function() {
          if (currentMonthKey) {
            saveOvertimeData();
            saveAllParams();
          }
          saveCustomItems();
        });

        showToast('📋 工资核算 已就绪');
      }

      document.addEventListener('DOMContentLoaded', initApp);

    })();
  </script>

</body>
</html>
